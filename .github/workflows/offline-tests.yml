name: Offline tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run offline test suite
        run: python -X utf8 -m harness.offline_tests
      - name: Run held-out synthetic search evaluation
        run: python -X utf8 -m harness.heldout_search_eval
