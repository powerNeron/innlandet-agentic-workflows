name: Offline tests

on:
  pull_request:
    branches: [main, "exam/final"]
  push:
    branches: [main, "exam/final", "feat/**"]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline test suite
        run: python -X utf8 -m harness.offline_tests
      - name: Run held-out synthetic search evaluation
        run: python -X utf8 -m harness.heldout_search_eval
      - name: Run UI contracts with runner-provided Node
        if: matrix.python-version == '3.13'
        run: node harness/browser_smoke.cjs --unit
